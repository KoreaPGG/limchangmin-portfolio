<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>사이트 콘텐츠 관리</title>
    <link rel="stylesheet" href="./admin.css?v=6" />
    <script src="./site-content.js?v=2" defer></script>
    <script src="./works-data.js" defer></script>
    <script src="./supabase-config.js" defer></script>
    <script src="./works-store.js?v=2" defer></script>
    <script src="./admin.js?v=5" defer></script>
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <header class="admin-topbar">
        <a class="admin-title" href="/" aria-label="Lim Changmin 홈">Lim Changmin</a>
        <a class="public-link" href="/work/">사이트 보기</a>
      </header>

      <section class="page-intro">
        <div>
          <h1>사이트 콘텐츠 관리</h1>
          <p class="page-lede">작업물과 페이지 내용을 수정합니다.</p>
        </div>
      </section>

      <p id="status" class="admin-status" role="status" aria-live="polite"></p>

      <form id="login" class="login-card">
        <div class="login-card-heading">
          <h2>관리자 로그인</h2>
        </div>
        <p class="card-description">등록된 관리자 계정으로 로그인해 사이트 콘텐츠를 관리할 수 있습니다.</p>
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" autocomplete="username" placeholder="name@example.com" required />
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required />
        <button class="button-primary login-submit" type="submit">로그인</button>
      </form>

      <section id="editor" hidden>
        <div class="editor-heading">
          <h2>관리 항목</h2>
          <button id="logout" class="button-quiet" type="button">로그아웃</button>
        </div>

        <nav id="editor-tabs" class="editor-tabs" aria-label="관리 항목">
          <button type="button" data-panel="work-panel" aria-pressed="true">Work</button>
          <button type="button" data-panel="content-panel" aria-pressed="false">페이지 콘텐츠</button>
        </nav>

        <div id="work-panel" class="management-panel">
          <div class="panel-heading">
            <h2>작업물 관리</h2>
            <p>작품의 제목, 연도, 이미지와 동영상을 수정합니다.</p>
          </div>
          <div class="work-layout">
            <aside class="work-selector-card">
              <label for="work-select">편집할 작업물</label>
              <select id="work-select"></select>
              <p>새 작업물을 추가하거나 목록에서 기존 작업물을 선택하세요.</p>
            </aside>
            <form id="work-form" class="editor-card">
              <h3 class="form-title">작업물 정보</h3>
              <div class="form-grid">
                <label>제목 <input name="title" maxlength="300" required /></label>
                <label>연도 <input name="year" type="number" min="1" max="9999" required /></label>
              </div>
              <label>대표 이미지 <input name="image" type="file" accept="image/*" /></label>
              <p id="image-info" class="field-hint"></p>
              <label>동영상 <input name="video" type="file" accept="video/*" /></label>
              <p id="video-info" class="field-hint"></p>
              <label class="checkbox-label"><input name="removeVideo" type="checkbox" /> 기존 동영상 제거</label>
              <div class="form-actions">
                <button class="button-primary" type="submit">변경사항 저장</button>
                <button id="delete-work" class="button-danger" type="button" hidden>작업물 삭제</button>
              </div>
            </form>
          </div>
        </div>

        <section id="content-panel" class="management-panel" hidden>
          <div class="panel-heading">
            <h2>페이지 콘텐츠</h2>
            <p>About, Press, Exhibition Views의 내용을 수정합니다.</p>
          </div>
          <div class="content-controls">
            <label for="content-page">편집할 페이지
              <select id="content-page">
                <option value="exhibition">Exhibition Views</option>
                <option value="about">About</option>
                <option value="press">Press</option>
              </select>
            </label>
            <div class="content-save-hint">
              <span class="draft-state" id="content-draft-state">변경사항 없음</span>
              <p>저장하면 공개 사이트에 반영됩니다.</p>
            </div>
          </div>
          <form id="content-form" class="editor-card content-editor-card">
            <div id="content-fields"></div>
            <div class="form-footer">
              <p>업로드한 이미지 원본은 저장소에 보관됩니다.</p>
              <button class="button-primary" type="submit">페이지 내용 저장</button>
            </div>
          </form>
        </section>
      </section>
    </main>
  </body>
</html>
