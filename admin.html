<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>사이트 콘텐츠 관리</title>
    <link rel="stylesheet" href="./admin.css?v=2" />
    <script src="./site-content.js?v=1" defer></script>
    <script src="./works-data.js" defer></script>
    <script src="./supabase-config.js" defer></script>
    <script src="./works-store.js?v=2" defer></script>
    <script src="./admin.js?v=2" defer></script>
  </head>
  <body>
    <main>
      <h1>사이트 콘텐츠 관리</h1>
      <p><a href="/work/">공개 페이지 보기</a></p>
      <p id="status" role="status" aria-live="polite"></p>
      <form id="login">
        <label>이메일 <input name="email" type="email" autocomplete="username" required /></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">로그인</button>
      </form>
      <section id="editor" hidden>
        <button id="logout" type="button">로그아웃</button>
        <nav id="editor-tabs" aria-label="관리 항목">
          <button type="button" data-panel="work-panel" aria-pressed="true">Work</button>
          <button type="button" data-panel="content-panel" aria-pressed="false">About · Press · Exhibition Views</button>
        </nav>
        <div id="work-panel">
          <label>작업물 선택 <select id="work-select"></select></label>
          <form id="work-form">
            <label>제목 <input name="title" maxlength="300" required /></label>
            <label>연도 <input name="year" type="number" min="1" max="9999" required /></label>
            <label>이미지 <input name="image" type="file" accept="image/*" /></label>
            <p id="image-info"></p>
            <label>동영상 <input name="video" type="file" accept="video/*" /></label>
            <p id="video-info"></p>
            <label><input name="removeVideo" type="checkbox" /> 기존 동영상 제거</label>
            <button type="submit">저장</button>
            <button id="delete-work" type="button" hidden>작업물 삭제</button>
          </form>
        </div>
        <section id="content-panel" hidden>
          <label>편집할 페이지
            <select id="content-page">
              <option value="exhibition">Work — Exhibition Views</option>
              <option value="about">About</option>
              <option value="press">Press</option>
            </select>
          </label>
          <form id="content-form">
            <div id="content-fields"></div>
            <button type="submit">페이지 내용 저장</button>
          </form>
        </section>
      </section>
    </main>
  </body>
</html>
